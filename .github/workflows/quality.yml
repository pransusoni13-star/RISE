name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image from this commit
        run: docker build --pull -t rise-api:security-check backend
      - name: Scan operating-system and application dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: rise-api:security-check
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rise_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: rise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:logic
      - run: npm run security:audit
      - run: npx expo export --platform ios --output-dir dist-ios
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # Invoke pytest through the selected interpreter so the backend working
      # directory is consistently available on sys.path across platforms.
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          RISE_TEST_POSTGRES_URL: postgresql+psycopg://rise_test:isolated-ci-password@localhost:5432/rise_test
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
